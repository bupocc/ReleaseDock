services:
  app:
    build: .
    image: releasedock:local
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      DATA_DIR: /app/data
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${PORT:-8080}}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS-loopback,uniquelocal}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - releasedock_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  releasedock_data:
