.af-page{width:100%;max-width:1120px;margin:0 auto;color:var(--ink)}
.af-page-heading{display:flex;align-items:center;justify-content:space-between;gap:24px;margin:1px 0 27px}
.af-eyebrow{font:10px var(--number);letter-spacing:1.8px;color:#98a08e;margin-bottom:8px}
.af-page-heading h1{font-size:27px;letter-spacing:-.8px;line-height:1.45;font-weight:600}
.af-page-heading p{font-size:11px;color:var(--muted);margin-top:7px}
.af-page-actions{display:flex;gap:9px;align-items:center}
.af-page-actions .btn{font-size:11px;min-height:37px;padding:8px 13px}
.af-layout{display:grid;grid-template-columns:minmax(0,2.05fr) minmax(264px,1fr);gap:23px;align-items:start}
.af-main-column,.af-side-column{display:flex;flex-direction:column;gap:20px;min-width:0}
.af-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;min-width:0}
.af-card-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:22px}
.af-card-heading h2{font-size:14px;font-weight:600;letter-spacing:.1px}
.af-card-heading p{font-size:10px;color:#939d8a;margin-top:5px}
.af-card-heading>svg{color:#9aa58f;margin-top:3px}
.af-section-number{font-size:10px;color:#bcc3b2;padding-top:2px}
.af-fields{display:grid;gap:19px 19px}
.af-two-fields{grid-template-columns:repeat(2,minmax(0,1fr))}
.af-field{display:block;min-width:0}
.af-field>span:first-child,.af-fieldset legend{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:500;margin-bottom:8px;color:#56634d}
.af-field i,.af-fieldset i{font-size:11px;color:#8ea779;font-style:normal}
.af-field input:not([type=radio]):not([type=checkbox]),.af-field select,.af-field textarea{display:block;width:100%;border:1px solid #e0e5d9;border-radius:6px;min-height:39px;padding:9px 11px;background:#fff;color:#35462f;font-size:11px;line-height:1.65;transition:border-color .15s,box-shadow .15s}
.af-field input::placeholder,.af-field textarea::placeholder{color:#a8b19d}
.af-field select{padding-right:26px;cursor:pointer}
.af-field input:hover,.af-field select:hover,.af-field textarea:hover{border-color:#bfcfb3}
.af-field input:focus,.af-field select:focus,.af-field textarea:focus{outline:none;border-color:#8eaf77;box-shadow:0 0 0 3px #eaf2e3}
.af-field input[aria-invalid=true],.af-field textarea[aria-invalid=true]{border-color:#bd825e}
.af-field small{display:block;font-size:9px;color:#9da68f;margin-top:6px;line-height:1.7}
.af-field em{font:9px var(--number);font-style:normal;color:#a8b09d;margin-left:auto;font-weight:400}
.af-optional{font-size:9px;color:#a8b09d;font-weight:400;margin-left:3px}
.af-input-prefix{display:flex;align-items:center;border:1px solid #e0e5d9;border-radius:6px;min-height:39px;overflow:hidden;background:#fff}
.af-input-prefix:focus-within{border-color:#8eaf77;box-shadow:0 0 0 3px #eaf2e3}
.af-input-prefix>span{padding:0 0 0 13px;color:#9da88f;font-size:12px}
.af-input-prefix input{border:0!important;box-shadow:none!important;min-width:0;flex:1;padding-left:7px!important}
.af-input-prefix:has(input[aria-invalid=true]){border-color:#bd825e}
.af-slug-input>span{font-size:15px;padding-left:12px}
.af-website-input>span{display:flex;align-items:center;padding-left:11px}
.af-website-input input{font-size:10px!important}
.af-span-all{grid-column:1/-1}
.af-fieldset{padding:0;border:0;margin:0;min-width:0}
.af-fieldset legend{padding:0;float:none;width:auto}
.af-channel-group{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.af-radio-option{display:flex;align-items:center;gap:9px;position:relative;min-width:0;border:1px solid #e2e7db;border-radius:7px;padding:11px 12px;cursor:pointer;transition:background .15s,border-color .15s}
.af-radio-option:has(input:checked){border-color:#b0c7a0;background:#f7faf2}
.af-radio-option input,.af-platform-choices input,.af-visibility-option input{width:13px;height:13px;margin:0;accent-color:var(--green);flex-shrink:0}
.af-radio-option strong{display:block;font-size:11px;font-weight:500;color:#5a6a4d}
.af-radio-option small{font-size:9px;color:#a0aa94;margin-top:2px}
.af-channel-dot{width:5px;height:5px;background:#a8ba8e;border-radius:50%;margin-left:auto;opacity:0}
.af-radio-option:has(input:checked) .af-channel-dot{opacity:1}
.af-error{display:block;font-size:10px;line-height:1.7;color:#aa6545;margin-top:5px}
.af-error:empty{display:none}
.af-editor-card .af-card-heading{margin-bottom:17px}
.af-editor{border:1px solid #e0e5d9;border-radius:7px;overflow:hidden;background:#fff}
.af-editor-toolbar{display:flex;align-items:center;justify-content:space-between;background:#fbfcf8;border-bottom:1px solid #e8ece2;height:40px;padding:0 11px}
.af-editor-tabs{align-self:stretch;display:flex;gap:5px}
.af-editor-tabs button{position:relative;background:transparent;color:#97a18b;padding:0 11px;font-size:10px}
.af-editor-tabs button.active{color:#49633a;font-weight:600}
.af-editor-tabs button.active:after{content:'';position:absolute;bottom:-1px;left:9px;right:9px;height:2px;background:#6c9153}
.af-format-actions{display:flex;align-items:center;gap:2px}
.af-format-actions[hidden]{display:none}
.af-format-actions button{display:flex;align-items:center;justify-content:center;color:#929e85;width:26px;height:26px;border-radius:4px;background:none;font:500 13px var(--number)}
.af-format-actions button:hover{color:#46623a;background:#edf2e6}
.af-editor textarea{display:block;width:100%;height:258px;border:0;resize:vertical;min-height:180px;padding:16px 18px;font-size:11px;line-height:2;color:#768467;background:#fff;outline:none;tab-size:2}
.af-editor textarea:focus-visible{outline:2px solid #a9be98;outline-offset:-2px}
.af-editor-footer{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:8px 13px;border-top:1px solid #eff2e9;color:#a0aa93;font-size:9px}
.af-markdown-badge{display:inline-flex;align-items:center;justify-content:center;border:1px solid #bdc6b1;border-radius:2px;font:9px var(--number);height:13px;min-width:17px;margin-right:3px}
.af-inline-preview{height:258px;overflow:auto;padding:16px 18px}
.af-markdown{font-size:11px;color:#7d896f;line-height:1.9;overflow-wrap:anywhere}
.af-markdown h3,.af-markdown h4,.af-markdown h5{color:#466139;font-size:12px;font-weight:600;margin:14px 0 6px}
.af-markdown>h3:first-child,.af-markdown>h4:first-child,.af-markdown>h5:first-child{margin-top:0}
.af-markdown p{margin:7px 0}
.af-markdown ul{margin:5px 0 13px;padding-left:19px}
.af-markdown li{padding-left:2px;margin-bottom:3px}
.af-markdown li::marker{color:#b1bf9f;font-size:8px}
.af-markdown strong{color:#566e46}
.af-markdown code{font:10px var(--number);padding:2px 5px;border-radius:3px;background:#f0f4e9;color:#667e4f}
.af-markdown a{color:var(--green);text-decoration:underline;text-underline-offset:3px}
.af-file-count{color:#99a88a;font-size:10px;margin-top:3px;white-space:nowrap}
.af-assets-card .af-card-heading{margin-bottom:17px}
.af-dropzone{border:1px dashed #ccd7be;background:#fafcf6;border-radius:7px;text-align:center;padding:18px 15px 16px;transition:background .15s,border-color .15s}
.af-drag-active{background:#edf5e4;border-color:#789d5a}
.af-upload-symbol{display:flex;width:37px;height:37px;align-items:center;justify-content:center;border-radius:10px;background:#eff4e8;color:#8ca674;margin:0 auto 9px}
.af-dropzone p{font-size:10px;color:#97a488}
.af-dropzone p button{background:none;color:#54783b;font-size:11px;padding:2px 0;font-weight:500}
.af-dropzone p button:hover{text-decoration:underline;text-underline-offset:3px}
.af-dropzone small{font-size:9px;color:#adb59f;display:block;margin-top:3px}
.af-files{margin-top:13px}
.af-file-row{display:grid;grid-template-columns:24px minmax(0,1fr) 73px 91px 21px;gap:9px;align-items:center;padding:13px 1px;border-bottom:1px solid #edf0e7}
.af-file-row:last-child{border-bottom:0}
.af-file-icon{color:#8a9b77;display:flex;align-items:center;justify-content:center}
.af-file-info{min-width:0}
.af-file-info strong{font:11px/1.8 var(--number);color:#657957;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.af-file-info>span{display:flex;align-items:center;font-size:9px;color:#a6af98;white-space:nowrap}
.af-file-dot{padding:0 6px;color:#bcc5af}
.af-file-select{font-size:9px;padding:5px 4px;min-height:29px;color:#879774;border:1px solid #e5eadd;border-radius:4px;background:#fff;max-width:100%}
.af-arch-select{font-size:9px}
.af-remove-file{display:flex;align-items:center;justify-content:center;background:none;color:#b0b8a3;min-width:21px;height:28px;border-radius:4px;padding:3px}
.af-remove-file:hover{background:#fcf1e8;color:#a77552}
.af-files-empty{padding:20px;text-align:center;color:#99a38b;font-size:11px}
.af-local-note{display:flex;gap:5px;align-items:flex-start;color:#a7b196;font-size:9px;margin-top:11px}
.af-local-note svg{margin-top:2px}
.af-publish-settings,.af-release-summary,.af-visibility-card,.af-project-preview-panel{padding:22px}
.af-publish-settings .af-card-heading{margin-bottom:22px}
.af-status-line{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#87977c}
.af-status-line .tag{font-size:9px;gap:4px;padding:5px 7px}
.af-settings-description{color:#9ca88f;line-height:1.85;font-size:10px;margin-top:11px}
.af-setting-divider{height:1px;background:#edf0e6;margin:19px 0}
.af-toggle-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;cursor:pointer}
.af-toggle-row strong{display:block;font-size:11px;font-weight:500;color:#596e4b}
.af-toggle-row small{display:block;font-size:9px;color:#a4af96;line-height:1.8;margin-top:5px}
.af-switch{display:inline-block;position:relative;width:30px;height:17px;flex-shrink:0;margin-top:2px}
.af-switch input{position:absolute;width:100%;height:100%;opacity:0;z-index:2;margin:0;cursor:pointer}
.af-switch>span{display:block;position:absolute;inset:0;border-radius:20px;background:#d7ddcf;transition:background .2s}
.af-switch>span:after{content:'';position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #203b2e1a;transition:transform .2s}

ss=\"featured\">\u003cdiv class=\"featured-top\">\u003cspan>\u003cspan class=\"status-dot\" style=\"background:#d2e3b8\">\u003c/span>最新发布\u003c/span>\u003cspan class=\"tag tag-dark\">FEATURED RELEASE\u003c/span>\u003c/div>\u003cdiv class=\"featured-main\">${projectMark('orbit','large')}\u003cdiv>\u003ch2>Orbit \u003cspan>v2.8.0\u003c/span>\u003c/h2>\u003cp>你的桌面，井然有序。\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"featured-copy\">全新的快捷启动体验，更流畅的多工作区切换。\u003cbr>还有 12 项细节改进，让专注更进一步。\u003c/p>\u003cdiv class=\"featured-bottom\">\u003ca class=\"btn\" href=\"${url('project','id=orbit')}\">获取最新版本 ${icon('arrow',14)}\u003c/a>\u003cdiv class=\"featured-platforms\">${platformIcons(['Windows','macOS','Linux'],15)}\u003c/div>\u003c/div>\u003c/aside>\u003c/section>\u003csection class=\"catalog\" id=\"projects\">\u003cdiv class=\"section-heading\">\u003cdiv>\u003ch2>探索项目 \u003cspan class=\"count\">06\u003c/span>\u003c/h2>\u003cp>为日常工作，找到顺手的好工具。\u003c/p>\u003c/div>\u003clabel class=\"search-field\">${icon('search',16)}\u003cinput id=\"project-search\" type=\"search\" placeholder=\"搜索项目名称、功能…\" aria-label=\"搜索项目\">\u003ckbd>/\u003c/kbd>\u003c/label>\u003c/div>\u003cdiv class=\"catalog-toolbar\">\u003cdiv class=\"filter-tabs\" role=\"group\" aria-label=\"项目分类\">${['全部项目','效率工具','开发工具','系统工具'].map((name,i)=>`\u003cbutton class=\"filter-tab ${i===0?'active':''}\" data-filter=\"${name}\" aria-pressed=\"${i===0}\">${name}\u003c/button>`).join('')}\u003c/div>\u003cbutton class=\"sort-button\" id=\"sort-projects\">最近更新 ${icon('down',13)}\u003c/button>\u003c/div>\u003cdiv class=\"project-grid\" id=\"project-grid\">${projects.map(projectCard).join('')}\u003c/div>\u003c/section>${footer()}\u003c/main>`;\n}\n\nfunction prototypeNav() {\n  return `\u003cnav class=\"prototype-nav\" aria-label=\"设计预览页面\">\u003cspan>设计预览\u003c/span>${[['home','项目首页'],['project','版本下载'],['login','密钥登录'],['overview','后台概览'],['projects','项目管理'],['publish','发布版本']].map(([id,name])=>`\u003ca href=\"${url(id)}\" class=\"${page===id?'active':''}\">${name}\u003c/a>`).join('')}\u003c/nav>`;\n}\n\nlet toastTimer;\nexport function toast(message) {\n  const node = document.querySelector('#toast');\n  node.textContent = message;\n  node.classList.add('visible');\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(()=>node.classList.remove('visible'),3500);\n}\n\nfunction bindHome() {\n  let category = '全部项目';\n  let reversed = false;\n  const search = document.querySelector('#project-search');\n  const update = () => {\n    const term = search.value.trim().toLowerCase();\n    const items = projects.filter(p => (category === '全部项目' || p.category === category) && `${p.name} ${p.subtitle} ${p.description}`.toLowerCase().includes(term));\n    if (reversed) items.reverse();\n    document.querySelector('#project-grid').innerHTML = items.length ? items.map(projectCard).join('') : '\u003cdiv class=\"empty-state\">没有找到匹配的项目，试试其他关键词。\u003c/div>';\n  };\n  search.addEventListener('input',update);\n  document.querySelectorAll('[data-filter]').forEach(button => button.addEventListener('click',()=>{\n    category = button.dataset.filter;\n    document.querySelectorAll('[data-filter]').forEach(item=>{ item.classList.toggle('active',item===button);item.setAttribute('aria-pressed',String(item===button)); });\n    update();\n  }));\n  document.querySelector('#sort-projects').addEventListener('click',event=>{ reversed=!reversed;event.currentTarget.innerHTML=`${reversed?'最早更新':'最近更新'} ${icon('down',13)}`;update(); });\n  document.addEventListener('keydown',event=>{if(event.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){event.preventDefault();search.focus();}});\n}\n\nasync function render() {\n  let markup;\n  let bind;\n  if (page === 'home') {\n    markup = home();\n    bind = bindHome;\n  } else if (['project','login','activity'].includes(page)) {\n    const publicPages = await import('releasedock/public-pages.js');\n    markup = publicPages.renderPublic(page, params);\n    bind = () => publicPages.bindPublic(page, params);\n  } else {\n    const adminPages = await import('releasedock/admin-pages.js');\n    markup = await adminPages.renderAdmin(page, params);\n    bind = () => adminPages.bindAdmin(page, params);\n  }\n  document.querySelector('#app').innerHTML = markup + prototypeNav();\n  document.querySelectorAll('[data-toast]').forEach(node=>node.addEventListener('click',()=>toast(node.dataset.toast)));\n  if (bind) await bind();\n  document.documentElement.dataset.ready = 'true';\n}\n\nrender().catch(error=>{\n  document.querySelector('#app').innerHTML = `${header()}\u003cmain class=\"container\" style=\"padding-block:70px\">\u003ch1>这个预览页面正在准备中\u003c/h1>\u003cp style=\"margin-block:20px\">首页已经可以查看，其余设计页面会随制作完成开放。\u003c/p>\u003ca class=\"btn btn-primary\" href=\"${url('home')}\">返回项目首页\u003c/a>\u003c/main>`;\n  console.error(error);\n});\n","releasedock/public-pages.js":"import { icon, logo, projectMark } from 'releasedock/icons.js';\nimport { projects, assets } from 'releasedock/data.js';\nimport { header, footer, platformIcons, url, toast } from 'releasedock/app.js';\n\nfunction filesFor(project, version) {\n  if (project.id === 'orbit') return assets.map(file=>({...file,name:file.name.replace('2.8.0',version)}));\n  return project.platforms.map(system=>({ system, arch:system==='macOS'?'Apple Silicon':'x64', name:`${project.name}-${version}-${system.toLowerCase()}${system==='Windows'?'.exe':system==='macOS'?'.dmg':'.AppImage'}`, size:project.size, type:system==='Windows'?'安装程序':system==='macOS'?'磁盘映像':'AppImage', icon:system==='Windows'?'windows':system==='macOS'?'apple':'terminal' }));\n}\n\nfunction downloadRows(project, version) {\n  return filesFor(project,version).map((file,index)=>`\u003cdiv class=\"download-row\">\u003cspan class=\"os-mark\">${icon(file.icon,22)}\u003c/span>\u003cdiv class=\"download-file\">\u003cdiv>\u003cstrong>${file.system}\u003c/strong>\u003cspan class=\"tag\">${file.arch}\u003c/span>${index===0?'\u003cspan class=\"recommended\">常用版本\u003c/span>':''}\u003c/div>\u003cp class=\"mono\">${file.name}\u003c/p>\u003c/div>\u003cspan class=\"file-size mono\">${file.size}\u003c/span>\u003cbutton class=\"checksum\" data-checksum=\"${file.name}\" aria-label=\"查看 ${file.name} 的 SHA-256 校验信息\">SHA-256 ${icon('copy',11)}\u003c/button>\u003cbutton class=\"btn ${index===0?'btn-primary':'btn-light'} btn-sm\" data-toast=\"这是界面设计预览，真实安装包将在接入后端后提供。\">${icon('download',14)}下载\u003c/button>\u003c/div>`).join('');\n}\n\nfunction projectPage(params) {\n  const project = projects.find(item=>item.id===params.get('id')) || projects[0];\n  const requestedVersion = params.get('v');\n  const version = requestedVersion && /^\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?$/.test(requestedVersion) ? requestedVersion : project.version;\n  const history = project.id==='orbit' ? ['2.8.0','2.7.2','2.7.1','2.7.0','2.6.0'] : [project.version];\n  const dates = ['2026.09.08','2026.08.22','2026.08.15','2026.08.01','2026.07.18'];\n  const selectedIndex = Math.max(0,history.indexOf(version));\n  const date = project.id==='orbit'?dates[selectedIndex]:project.date;\n  const isLatest = version===project.version;\n  document.title = `${project.name} v${version} · ReleaseDock`;\n  return `${header()}\u003cmain class=\"container\">\u003cdiv class=\"breadcrumb\">\u003ca href=\"${url('home')}\">全部项目\u003c/a>${icon('back',12,'style=\"transform:rotate(180deg)\"')}\u003cspan>${project.name}\u003c/span>\u003c/div>\u003csection class=\"project-header\">\u003cdiv class=\"project-identity\">${projectMark(project.id,'large')}\u003cdiv>\u003cdiv class=\"project-title-line\">\u003ch1>${project.name}\u003c/h1>\u003cspan class=\"tag tag-outline\">${project.category}\u003c/span>\u003c/div>\u003cp>${project.subtitle} · ${project.description}\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"project-actions\">\u003cbutton class=\"btn btn-light\" id=\"share-project\">${icon('link',15)}分享\u003c/button>\u003ca class=\"btn btn-primary\" href=\"#downloads\">${icon('download',16)}获取${isLatest?'最新':'此'}版本\u003c/a>\u003c/div>\u003c/section>\u003cdiv class=\"project-tabs\">\u003ca class=\"active\" href=\"#releases\">版本发布 \u003cspan class=\"mono\">${project.releases.toString().padStart(2,'0')}\u003c/span>\u003c/a>\u003ca href=\"#about-project\">项目介绍\u003c/a>\u003cspan class=\"project-platforms\">${platformIcons(project.platforms)}\u003cspan>跨平台支持\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"release-layout\" id=\"releases\">\u003caside class=\"version-sidebar\">\u003cdiv class=\"sidebar-label\">版本历史 \u003cspan class=\"mono\">${project.releases}\u003c/span>\u003c/div>\u003cdiv class=\"version-nav\">${history.map((item,i)=>`\u003ca href=\"${url('project',`id=${project.id}&v=${item}`)}\" class=\"${item===version?'active':''}\">\u003cspan class=\"version-nav-dot\">\u003c/span>\u003cdiv>\u003cstrong class=\"mono\">v${item}\u003c/strong>${i===0?'\u003cspan class=\"latest-text\">最新\u003c/span>':''}\u003csmall class=\"mono\">${project.id==='orbit'?dates[i]:project.date}\u003c/small>\u003c/div>${item===version?icon('back',12,'style=\"transform:rotate(180deg)\"'):''}\u003c/a>`).join('')}\u003c/div>\u003cdiv class=\"project-about\" id=\"about-project\">\u003ch4>关于 ${project.name}\u003c/h4>\u003cp>${project.description}\u003c/p>\u003cdl>\u003cdiv>\u003cdt>累计下载\u003c/dt>\u003cdd class=\"mono\">${project.downloads}\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>版本发布\u003c/dt>\u003cdd class=\"mono\">${project.releases} 次\u003c/dd>\u003c/div>\u003c/dl>\u003c/div>\u003cdiv class=\"sidebar-tip\">${icon('shield',17)}\u003cp>公开下载，无需登录。\u003cbr>安装前可核对文件校验值。\u003c/p>\u003c/div>\u003c/aside>\u003csection class=\"release-detail\">\u003cdiv class=\"release-topline\">\u003cdiv>\u003ch2 class=\"mono\">v${version}\u003c/h2>\u003cspan class=\"tag tag-green\">稳定版\u003c/span>${isLatest?'\u003cspan class=\"latest-release\">最新版本\u003c/span>':''}\u003c/div>\u003cspan class=\"muted small\">${icon('clock',13)} \u003cspan class=\"mono\">${date}\u003c/span> 发布\u003c/span>\u003c/div>\u003cdiv class=\"release-notes\">\u003ch3>${project.id==='orbit'&&isLatest?'更从容的工作，从更有序的桌面开始。':`${project.name} ${version} 更新已就绪。`}\u003c/h3>\u003cp>这次更新，我们把注意力放在了那些每天都会用到的细节上。\u003c/p>\u003cdiv class=\"note-group\">\u003cspan class=\"note-icon added\">+\u003c/span>\u003cdiv>\u003ch4>新增功能\u003c/h4>\u003cul>\u003cli>${project.id==='orbit'?'全新快捷启动面板，应用与文件一搜即达。':'新增快捷操作入口，常用功能更容易找到。'}\u003c/li>\u003cli>${project.id==='orbit'?'支持多个工作区，自由切换不同工作状态。':'支持自定义工作配置，适应不同使用场景。'}\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"note-group\">\u003cspan class=\"note-icon improved\">↗\u003c/span>\u003cdiv>\u003ch4>体验优化\u003c/h4>\u003cul>\u003cli>优化启动速度，减少后台资源占用。\u003c/li>\u003cli>改进高分辨率屏幕下的文字与图标显示。\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"note-group\">\u003cspan class=\"note-icon fixed\">✓\u003c/span>\u003cdiv>\u003ch4>问题修复\u003c/h4>\u003cul>\u003cli>修复部分设备休眠后无法正常恢复的问题。\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/div>\u003csection class=\"download-section\" id=\"downloads\">\u003cdiv class=\"download-heading\">\u003ch3>下载安装包 \u003cspan class=\"count mono\">${filesFor(project,version).length.toString().padStart(2,'0')}\u003c/span>\u003c/h3>\u003cspan>选择适合你设备的版本\u003c/span>\u003c/div>\u003cdiv class=\"download-list\">${downloadRows(project,version)}\u003c/div>\u003cdiv class=\"download-footnote\">${icon('info',13)}macOS 用户请根据芯片类型选择 Apple Silicon 或 Intel 版本。\u003c/div>\u003c/section>\u003c/section>\u003c/div>${footer()}\u003c/main>`;\n}\n\nfunction loginPage() {\n  document.title = '管理员登录 · ReleaseDock';\n  return `\u003cdiv class=\"login-page\">\u003ca class=\"brand login-brand\" href=\"${url('home')}\">${logo()}\u003cspan class=\"brand-name\">ReleaseDock\u003c/span>\u003c/a>\u003ca class=\"login-back\" href=\"${url('home')}\">${icon('back',14)}返回发布中心\u003c/a>\u003cmain class=\"login-shell\">\u003csection class=\"login-story\">\u003cdiv class=\"eyebrow\">BUILT TO SHIP\u003c/div>\u003ch1>每一次发布，\u003cbr>都是新的开始。\u003c/h1>\u003cp>为好软件，留一个可靠的出发地。\u003cbr>管理项目、整理版本，把最新进展带给用户。\u003c/p>\u003cdiv class=\"login-release-art\" aria-hidden=\"true\">\u003cdiv class=\"art-track\">\u003c/div>\u003cdiv class=\"art-release art-release-old\">\u003cdiv>\u003cspan class=\"art-dot\">\u003c/span>\u003cspan class=\"mono\">v2.7.0\u003c/span>\u003c/div>\u003cspan>已发布 ${icon('check',12)}\u003c/span>\u003c/div>\u003cdiv class=\"art-release art-release-mid\">\u003cdiv>\u003cspan class=\"art-dot\">\u003c/span>\u003cspan class=\"mono\">v2.7.2\u003c/span>\u003c/div>\u003cspan>已发布 ${icon('check',12)}\u003c/span>\u003c/div>\u003cdiv class=\"art-release art-release-new\">\u003cdiv>\u003cspan class=\"art-cube\">${icon('box',23)}\u003c/span>\u003cspan>\u003cstrong class=\"mono\">v2.8.0\u003c/strong>\u003csmall>准备好，与世界见面。\u003c/small>\u003c/span>\u003c/div>\u003cspan class=\"art-check\">${icon('check',18)}\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"login-story-foot\">\u003cspan class=\"status-dot\">\u003c/span>小而专注，为每一位创造者。\u003c/div>\u003c/section>\u003csection class=\"login-form-side\">\u003cdiv class=\"login-key\">${icon('key',26)}\u003c/div>\u003cdiv class=\"login-title\">\u003ch2>欢迎回来\u003c/h2>\u003cp>输入管理员密钥，进入你的发布工作台。\u003c/p>\u003c/div>\u003cform id=\"login-form\">\u003clabel class=\"form-label\" for=\"admin-key\">管理员密钥\u003c/label>\u003cdiv class=\"key-input\">${icon('lock',17)}\u003cinput type=\"password\" id=\"admin-key\" placeholder=\"请输入管理员密钥\" autocomplete=\"off\" aria-describedby=\"login-help\">\u003cbutton type=\"button\" id=\"toggle-key\" aria-label=\"显示密钥\">${icon('eye',18)}\u003c/button>\u003c/div>\u003cdiv class=\"field-hint\" id=\"login-help\">密钥由站点管理员提供，请妥善保管。\u003c/div>\u003cbutton type=\"submit\" class=\"btn btn-primary btn-wide login-submit\">验证并进入 ${icon('arrow',17)}\u003c/button>\u003cp class=\"login-error\" id=\"login-error\" role=\"alert\">\u003c/p>\u003c/form>\u003cdiv class=\"login-divider\">\u003cspan>仅供站点管理员使用\u003c/span>\u003c/div>\u003cdiv class=\"login-security\">${icon('shield',17)}\u003cp>访问项目和下载软件无需登录。\u003cbr>如果你只是来获取软件，请直接返回发布中心。\u003c/p>\u003c/div>\u003ca class=\"login-demo\" href=\"${url('overview')}\">预览后台设计 ${icon('arrow',13)}\u003c/a>\u003cp class=\"login-demo-hint\">当前为设计稿，请勿输入真实密钥。\u003c/p>\u003c/section>\u003c/main>\u003cfooter class=\"login-footer\">\u003cspan>© 2026 ReleaseDock\u003c/span>\u003cspan>让发布简单一点。\u003c/span>\u003cspan>界面设计稿 · 示例数据\u003c/span>\u003c/footer>\u003c/div>`;\n}\n\nfunction activityPage() {\n  document.title = '更新动态 · ReleaseDock';\n  return `${header('activity')}\u003cmain class=\"container activity-page\">\u003cdiv class=\"eyebrow\">WHAT'S NEW\u003c/div>\u003ch1>每一步，都在向前。\u003c/h1>\u003cp class=\"muted\">所有项目的最新版本，在这里一览。\u003c/p>\u003cdiv class=\"activity-list\">${projects.map((project,i)=>`\u003carticle class=\"activity-item\">\u003cspan class=\"activity-date mono\">${project.date}\u003c/span>\u003cspan class=\"activity-dot\">\u003c/span>\u003cdiv class=\"activity-content\">\u003cdiv class=\"activity-project\">${projectMark(project.id,'small')}\u003ch2>${project.name}\u003c/h2>\u003cspan class=\"mono\">v${project.version}\u003c/span>\u003cspan class=\"tag tag-green\">稳定版\u003c/span>\u003c/div>\u003cp>${i===0?'全新快捷启动面板、多工作区支持，以及多项体验优化。':`${project.subtitle}迎来新版本，带来功能改进与稳定性提升。`}\u003c/p>\u003ca class=\"link-button\" href=\"${url('project',`id=${project.id}`)}\">查看更新与下载 ${icon('arrow',14)}\u003c/a>\u003c/div>\u003c/article>`).join('')}\u003c/div>${footer()}\u003c/main>`;\n}\n\nexport function renderPublic(page,params) {\n  if (page==='project') return projectPage(params);\n  if (page==='login') return loginPage();\n  return activityPage();\n}\n\nexport function bindPublic(page) {\n  if (page==='login') {\n    const input = document.querySelector('#admin-key');\n    document.querySelector('#toggle-key').addEventListener('click',event=>{ const visible=input.type==='password';input.type=visible?'text':'password';event.currentTarget.setAttribute('aria-label',visible?'隐藏密钥':'显示密钥'); });\n    document.querySelector('#login-form').addEventListener('submit',event=>{\n      event.preventDefault();\n      document.querySelector('#login-error').textContent = input.value ? '这是设计预览，不会发送或验证密钥。请使用下方「预览后台设计」。' : '请输入管理员密钥；查看设计稿请使用下方预览入口。';\n      input.value='';\n    });\n  }\n  if (page==='project') {\n    document.querySelector('#share-project').addEventListener('click',async()=>{\n      try {await navigator.clipboard.writeText(location.href);toast('项目链接已复制。');}catch{toast('当前浏览器未开放剪贴板，可直接复制地址栏中的链接。');}\n    });\n    document.querySelectorAll('[data-checksum]').forEach(button=>button.addEventListener('click',()=>toast('设计预览：正式发布时将显示由服务器计算的 SHA-256 文件校验值。')));\n  }\n}\n","releasedock/admin-pages.js":"import { icon, logo, projectMark } from 'releasedock/icons.js';\nimport { projects, releases, assets } from 'releasedock/data.js';\nimport { url, toast } from 'releasedock/app.js';\n\nconst labels = {overview:'概览',projects:'项目管理',releases:'版本管理',files:'文件管理','project-edit':'项目配置',publish:'发布新版本',settings:'站点设置'};\nconst navItems = [['overview','grid','概览'],['projects','box','项目管理'],['releases','layers','版本管理'],['files','folder','文件管理']];\n\nexport function adminShell(page,content) {\n  const active = page==='project-edit'?'projects':page==='publish'?'releases':page;\n  return `\u003cdiv class=\"admin-shell\">\u003caside class=\"admin-sidebar\">\u003ca class=\"brand admin-brand\" href=\"${url('overview')}\">${logo()}\u003cspan class=\"brand-name\">ReleaseDock\u003c/span>\u003c/a>\u003cdiv class=\"admin-workspace\">\u003cspan class=\"workspace-icon\">${icon('layers',19)}\u003c/span>\u003cdiv>\u003cstrong>软件发布中心\u003c/strong>\u003csmall>管理控制台\u003c/small>\u003c/div>\u003cspan class=\"workspace-badge\">PRO\u003c/span>\u003c/div>\u003cdiv class=\"admin-nav-label\">工作台\u003c/div>\u003cnav class=\"admin-nav\" aria-label=\"后台导航\">${navItems.map(([id,mark,name])=>`\u003ca href=\"${url(id)}\" class=\"${active===id?'active':''}\">${icon(mark,17)}\u003cspan>${name}\u003c/span>${id==='projects'?'\u003csmall class=\"mono\">6\u003c/small>':id==='releases'?'\u003csmall class=\"nav-dot\">\u003c/small>':''}\u003c/a>`).join('')}\u003c/nav>\u003cdiv class=\"admin-nav-label secondary\">管理\u003c/div>\u003cnav class=\"admin-nav\">\u003ca href=\"${url('settings')}\" class=\"${active==='settings'?'active':''}\">${icon('settings',17)}\u003cspan>站点设置\u003c/span>\u003c/a>\u003ca href=\"${url('home')}\">${icon('external',16)}\u003cspan>访问发布中心\u003c/span>\u003c/a>\u003c/nav>\u003cdiv class=\"sidebar-bottom\">\u003cdiv class=\"storage-widget\">\u003cdiv>\u003cspan>${icon('folder',13)}存储空间\u003c/span>\u003cspan class=\"mono\">6.4%\u003c/span>\u003c/div>\u003cdiv class=\"storage-track\">\u003cspan>\u003c/span>\u003c/div>\u003cp>\u003cstrong class=\"mono\">1.28 GB\u003c/strong> / \u003cspan class=\"mono\">20 GB\u003c/span>\u003cspan>示例\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"admin-account\">\u003cspan class=\"avatar\">A\u003c/span>\u003cdiv>\u003cstrong>管理员\u003c/strong>\u003csmall>\u003cspan class=\"status-dot\">\u003c/span>密钥登录\u003c/small>\u003c/div>\u003ca href=\"${url('login')}\" aria-label=\"退出管理预览\">${icon('logout',16)}\u003c/a>\u003c/div>\u003c/div>\u003c/aside>\u003cdiv class=\"admin-body\">\u003cheader class=\"admin-topbar\">\u003cdiv class=\"admin-breadcrumb\">\u003cspan>工作台\u003c/span>${icon('back',12,'style=\"transform:rotate(180deg)\"')}\u003cstrong>${labels[page]||'概览'}\u003c/strong>\u003c/div>\u003cdiv class=\"admin-topbar-right\">\u003cspan class=\"preview-label\">\u003cspan class=\"status-dot\">\u003c/span>设计预览\u003c/span>\u003ca href=\"${url('home')}\">预览站点 ${icon('diagonal',13)}\u003c/a>\u003cspan class=\"topbar-divider\">\u003c/span>\u003cspan class=\"avatar small-avatar\">A\u003c/span>\u003c/div>\u003c/header>\u003cmain class=\"admin-content\">${content}\u003cfooter class=\"admin-footer\">\u003cspan>ReleaseDock \u003cspan class=\"mono\">v1.0\u003c/span>\u003c/span>\u003cspan>界面设计稿 · 所有数据均为示例\u003c/span>\u003c/footer>\u003c/main>\u003c/div>\u003c/div>`;\n}\n\nfunction pageHeading(title,subtitle,actions='') {\n  return `\u003cdiv class=\"admin-page-heading\">\u003cdiv>\u003ch1>${title}\u003c/h1>\u003cp>${subtitle}\u003c/p>\u003c/div>\u003cdiv class=\"heading-actions\">${actions}\u003c/div>\u003c/div>`;\n}\n\nfunction releaseTable(items,full=false) {\n  return `\u003cdiv class=\"table-scroll\">\u003ctable class=\"data-table release-table\">\u003cthead>\u003ctr>\u003cth>项目 / 版本\u003c/th>${full?'\u003cth>发布渠道\u003c/th>':''}\u003cth>状态\u003c/th>\u003cth>更新时间\u003c/th>\u003cth class=\"align-right\">下载次数\u003c/th>\u003cth class=\"align-right\">操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${items.map(release=>{ const project=projects.find(item=>item.id===release.project);return `\u003ctr data-release-status=\"${release.status}\" data-release-search=\"${project.name} ${release.version}\">\u003ctd>\u003cdiv class=\"table-project\">${projectMark(project.id,'small')}\u003cdiv>\u003cstrong>${project.name}\u003c/strong>\u003cspan class=\"mono\">v${release.version}\u003c/span>\u003c/div>${release.version==='2.8.0'?'\u003cspan class=\"table-latest\">最新\u003c/span>':''}\u003c/div>\u003c/td>${full?`\u003ctd>\u003cspan class=\"tag ${release.channel==='稳定版'?'tag-green':'tag-orange'}\">${release.channel}\u003c/span>\u003c/td>`:''}\u003ctd>\u003cspan class=\"release-status ${release.status==='草稿'?'draft':''}\">\u003cspan>\u003c/span>${release.status}\u003c/span>\u003c/td>\u003ctd class=\"table-date mono\">${release.date}\u003c/td>\u003ctd class=\"align-right mono table-number\">${release.downloads}\u003c/td>\u003ctd class=\"align-right\">\u003ca class=\"table-action\" href=\"${release.status==='草稿'?url('publish'):url('project',`id=${project.id}`)}\">${release.status==='草稿'?'继续编辑':'查看版本'} ${icon('arrow',12)}\u003c/a>\u003c/td>\u003c/tr>`;}).join('')}\u003c/tbody>\u003c/table>\u003c/div>`;\n}\n\nfunction trendChart() {\n  return `\u003csvg class=\"trend-chart\" viewBox=\"0 0 650 192\" role=\"img\" aria-label=\"最近七天下载次数依次为18   } else content = ({overview:overviewPage,projects:projectsPage,releases:releasesPage,files:filesPage,settings:settingsPage}[page]||overviewPage)();\n  return adminShell(page,content);\n}\n\nexport async function bindAdmin(page,params) {\n  if (['publish','project-edit'].includes(page)) {\n    const forms = await import('releasedock/admin-forms.js');\n    forms.bindAdminForm(page,params);\n  }\n  if (page==='projects') {\n    let state='all';\n    const update=()=>{\n      const term=document.querySelector('#admin-project-search').value.trim().toLowerCase();\n      let visible=0;\n      document.querySelectorAll('[data-project-name]').forEach(row=>{row.hidden=state==='hidden'||!row.dataset.projectName.toLowerCase().includes(term);if(!row.hidden)visible++;});\n      document.querySelector('#projects-empty').hidden=visible>0;\n      document.querySelector('#project-count-label').textContent=`共 ${visible} 个项目`;\n    };\n    document.querySelector('#admin-project-search').addEventListener('input',update);\n    document.querySelectorAll('[data-project-state]').forEach(button=>button.addEventListener('click',()=>{state=button.dataset.projectState;document.querySelectorAll('[data-project-state]').forEach(item=>item.classList.toggle('active',item===button));update();}));\n  }\n  if (page==='releases') {\n    let state='all';\n    const update=()=>{\n      const term=document.querySelector('#release-search').value.trim().toLowerCase();\n      let visible=0;\n      document.querySelectorAll('[data-release-status]').forEach(row=>{row.hidden=(state!=='all'&&row.dataset.releaseStatus!==state)||!row.dataset.releaseSearch.toLowerCase().includes(term);if(!row.hidden)visible++;});\n      document.querySelector('#releases-empty').hidden=visible>0;\n      document.querySelector('#release-count-label').textContent=`显示 ${visible} 个版本 · 示例数据`;\n    };\n    document.querySelector('#release-search').addEventListener('input',update);\n    document.querySelectorAll('[data-release-filter]').forEach(button=>button.addEventListener('click',()=>{state=button.dataset.releaseFilter;document.querySelectorAll('[data-release-filter]').forEach(item=>item.classList.toggle('active',item===button));update();}));\n  }\n  if (page==='settings') document.querySelector('#site-settings-form').addEventListener('submit',event=>{event.preventDefault();toast('设置已在当前设计预览中确认；正式持久化将在后端实现。');});\n}\n","releasedock/admin-forms.js":"import { icon, projectMark } from 'releasedock/icons.js';\nimport { projects } from 'releasedock/data.js';\nimport { url, toast } from 'releasedock/app.js';\n\n// 设计稿只保存文字与文件元数据，安装包和图标内容不会上传或持久化。\nconst DRAFT_PREFIX = 'releasedock.design.';\nconst MAX_FILE_SIZE = 2 * 1024 ** 3;\nconst SYSTEMS = ['Windows', 'macOS', 'Linux'];\nconst ARCHITECTURES = ['x64', 'Apple Silicon', 'ARM64', 'Intel', '通用'];\nconst DEFAULT_NOTES = '## 新增\\n- 全新快捷面板，一键连接常用应用与文件\\n- 支持工作区自定义排序，整理更自由\\n\\n## 优化\\n- 提升启动速度，减少后台内存占用\\n- 优化多显示器下的窗口布局\\n\\n## 修复\\n- 修复休眠唤醒后的快捷键失效问题';\nlet releaseState;\nlet projectState;\n\nconst escapeHTML = value => String(value ?? '').replace(/[&\u003c>\"']/g, char => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' })[char]);\nconst textValue = (value, fallback, limit = 10000) => typeof value === 'string' ? value.slice(0, limit) : fallback;\nconst systemIcon = system => ({ Windows: 'windows', macOS: 'apple', Linux: 'terminal' })[system] || 'file';\nconst option = (value, selected) => `\u003coption value=\"${escapeHTML(value)}\"${value === selected ? ' selected' : ''}>${escapeHTML(value)}\u003c/option>`;\nconst errorSlot = name => `\u003cspan class=\"af-error\" id=\"af-error-${name}\" aria-live=\"polite\">\u003c/span>`;\n\nfunction readDraft(key, params) {\n  if (params?.has?.('capture')) return {};\n  try {\n    const value = JSON.parse(localStorage.getItem(DRAFT_PREFIX + key) || 'null');\n    return value && typeof value === 'object' && !Array.isArray(value) ? value : {};\n  } catch { return {}; }\n}\n\nfunction persistDraft(key, value) {\n  try {\n    localStorage.setItem(DRAFT_PREFIX + key, JSON.stringify(value));\n    return true;\n  } catch {\n    toast('当前浏览器无法保存草稿，内容仍保留在本页。');\n    return false;\n  }\n}\n\nfunction createRelease(params) {\n  const requestedProject = params?.get?.('project') || params?.get?.('id');\n  const saved = readDraft('publish', params);\n  const project = projects.find(item => item.id === requestedProject) || projects.find(item => item.id === saved.project) || projects[0];\n  const defaults = [\n    { name: `${project.name}-2.9.0-win-x64.exe`, size: 86.4 * 1024 ** 2, system: 'Windows', arch: 'x64', sample: true },\n    { name: `${project.name}-2.9.0-mac-arm64.dmg`, size: 92.1 * 1024 ** 2, system: 'macOS', arch: 'Apple Silicon', sample: true },\n    { name: `${project.name}-2.9.0-linux-x64.AppImage`, size: 88.3 * 1024 ** 2, system: 'Linux', arch: 'x64', sample: true },\n  ];\n  return {\n    project: project.id,\n    version: textValue(saved.version, '2.9.0', 100),\n    title: textValue(saved.title, '更轻盈的体验，更顺手的日常。', 120),\n    channel: saved.channel === 'preview' ? 'preview' : 'stable',\n    notes: textValue(saved.notes, DEFAULT_NOTES, 30000),\n    latest: saved.latest !== false && saved.channel !== 'preview',\n    files: Array.isArray(saved.files) ? saved.files.filter(file => file && typeof file.name === 'string' && Number.isFinite(file.size) && file.size >= 0 && file.size \u003c= MAX_FILE_SIZE).slice(0, 50).map(file => ({\n      name: file.name.slice(0, 255), size: file.size,\n      system: SYSTEMS.includes(file.system) ? file.system : 'Windows',\n      arch: ARCHITECTURES.includes(file.arch) ? file.arch : 'x64', sample: file.sample === true,\n    })) : defaults,\n  };\n}\n\nfunction createProject(params) {\n  const isNew = params?.get?.('new') === '1';\n  const source = projects.find(item => item.id === params?.get?.('id')) || projects[0];\n  const draftKey = `project.${isNew ? 'new' : source.id}`;\n  const saved = readDraft(draftKey, params);\n  return {\n    draftKey, sourceId: source.id, isNew,\n    name: textValue(saved.name, isNew ? '' : source.name, 60),\n    slug: textValue(saved.slug, isNew ? '' : source.id, 80),\n    summary: textValue(saved.summary, isNew ? '' : source.description, 120),\n    description: textValue(saved.description, isNew ? '' : `${source.name} 是一款为日常工作打造的${source.subtitle}。\\n${source.description}\\n\\n简洁的界面、顺手的操作，让你把更多精力留给重要的事。`, 5000),\n    category: ['效率工具', '开发工具', '系统工具'].includes(saved.category) ? saved.category : source.category,\n    website: textValue(saved.website, isNew ? '' : `https://${source.id}.example.com`, 500),\n    platforms: Array.isArray(saved.platforms) ? SYSTEMS.filter(system => saved.platforms.includes(system)) : isNew ? ['Windows'] : [...source.platforms],\n    visibility: saved.visibility === 'hidden' ? 'hidden' : 'public',\n    iconUrl: '',\n  };\n}\n\nfunction pageHeading(title, description, actions, eyebrow) {\n  return `\u003cheader class=\"af-page-heading\">\u003cdiv>\u003cdiv class=\"af-eyebrow\">${eyebrow}\u003c/div>\u003ch1>${title}\u003c/h1>\u003cp>${description}\u003c/p>\u003c/div>\u003cdiv class=\"af-page-actions\">${actions}\u003c/div>\u003c/header>`;\n}\n\nfunction cardHeading(title, description, trailing = '') {\n  return `\u003cdiv class=\"af-card-heading\">\u003cdiv>\u003ch2>${title}\u003c/h2>${description ? `\u003cp>${description}\u003c/p>` : ''}\u003c/div>${trailing}\u003c/div>`;\n}\n\nfunction fileSize(bytes) {\n  if (bytes >= 1024 ** 3) return `${(bytes / 1024 ** 3).toFixed(2)} GB`;\n  if (bytes >= 1024 ** 2) return `${(bytes / 1024 ** 2).toFixed(1)} MB`;\n  return bytes ? `${Math.max(1, Math.round(bytes / 1024))} KB` : '0 KB';\n}\n\nfunction fileRows(files) {\n  if (!files.length) return '\u003cdiv class=\"af-files-empty\">还没有安装包，选择文件开始添加。\u003c/div>';\n  return files.map((file, index) => `\u003cdiv class=\"af-file-row\">\u003cspan class=\"af-file-icon\">${icon(systemIcon(file.system), 21)}\u003c/span>\u003cdiv class=\"af-file-info\ 、DMG、AppImage、ZIP 等 · 单文件上限 2 GB，可配置\u003c/small>\u003cinput id=\"af-package-input\" type=\"file\" multiple hidden>\u003c/div>\n          \u003cdiv class=\"af-files\" id=\"af-file-list\">${fileRows(state.files)}\u003c/div>${errorSlot('files')}\n          \u003cp class=\"af-local-note\">${icon('info', 12)}文件选择仅在本地预览，示例安装包不会上传。\u003c/p>\n        \u003c/section>\n      \u003c/div>\n      \u003caside class=\"af-side-column\">\n        \u003csection class=\"af-card af-publish-settings\">\n          ${cardHeading('发布设置', '', icon('settings', 17))}\n          \u003cdiv class=\"af-status-line\">\u003cspan>当前状态\u003c/span>\u003cspan class=\"tag tag-orange\">${icon('edit', 10)}草稿\u003c/span>\u003c/div>\u003cp class=\"af-settings-description\">准备就绪后发布，让访客查看更新并下载安装包。\u003c/p>\n          \u003cdiv class=\"af-setting-divider\">\u003c/div>\n          \u003clabel class=\"af-toggle-row\">\u003cspan>\u003cstrong>设为最新稳定版\u003c/strong>\u003csmall id=\"af-latest-hint\">在项目前台优先展示此版本\u003c/small>\u003c/span>\u003cspan class=\"af-switch\">\u003cinput id=\"af-latest\" type=\"checkbox\" name=\"latest\"${state.latest ? ' checked' : ''}${state.channel === 'preview' ? ' disabled' : ''}>\u003cspan>\u003c/span>\u003c/span>\u003c/label>\n          \u003cdiv class=\"af-setting-divider\">\u003c/div>\n          \u003cdiv class=\"af-checklist\">\u003cspan>${icon('check', 13)}发布后，所有访客均可下载\u003c/span>\u003cspan>${icon('check', 13)}历史版本和文件会继续保留\u003c/span>\u003c/div>\n        \u003c/section>\n        \u003csection class=\"af-card af-release-summary\">\n          \u003cdiv class=\"af-summary-label\">发布预览 \u003cspan class=\"mono\">PREVIEW\u003c/span>\u003c/div>\n          \u003cdiv class=\"af-summary-identity\">\u003cspan id=\"af-summary-mark\">${projectMark(state.project)}\u003c/span>\u003cdiv>\u003ch3 id=\"af-summary-name\">${escapeHTML(projects.find(project => project.id === state.project).name)}\u003c/h3>\u003cspan class=\"mono\" id=\"af-summary-version\">v${escapeHTML(state.version)}\u003c/span>\u003c/div>\u003cspan class=\"tag tag-green\" id=\"af-summary-channel\">${state.channel === 'stable' ? '稳定版' : '预发布'}\u003c/span>\u003c/div>\n          \u003cp id=\"af-summary-title\">${escapeHTML(state.title)}\u003c/p>\u003cdiv class=\"af-summary-meta\">\u003cspan>${icon('file', 13)}\u003cspan id=\"af-summary-files\">${state.files.length} 个安装包\u003c/span>\u003c/span>\u003cspan>${icon('globe', 13)}公开发布\u003c/span>\u003c/div>\n          \u003cbutton class=\"btn btn-light btn-wide\" id=\"af-preview-release\" type=\"button\">${icon('eye', 15)}预览发布效果\u003c/button>\u003cbutton class=\"btn btn-primary btn-wide af-publish-button\" type=\"submit\">${icon('upload', 15)}发布版本\u003c/button>\u003cp class=\"af-save-status\" id=\"af-save-status\">设计预览 · 不会实际发布\u003c/p>\n        \u003c/section>\n        \u003cp class=\"af-side-note\">${icon('info', 13)}好的更新日志，也是一份写给使用者的说明。\u003c/p>\n      \u003c/aside>\n    \u003c/form>\n    \u003cdialog class=\"af-dialog\" id=\"af-preview-dialog\" aria-labelledby=\"af-dialog-heading\">\u003c/dialog>\n  \u003c/section>`;\n}\n\nfunction projectPreview(state) {\n  return `\u003cdiv class=\"af-project-preview\">\u003cdiv class=\"af-preview-card-head\">\u003cspan data-af-project-mark>${state.iconUrl ? `\u003cimg src=\"${escapeHTML(state.iconUrl)}\" class=\"af-custom-icon\" alt=\"项目图标\">` : projectMark(state.sourceId)}\u003c/span>\u003cdiv>\u003ch3 id=\"af-card-name\">${escapeHTML(state.name || '项目名称')}\u003c/h3>\u003cspan class=\"mono\" id=\"af-card-slug\">/${escapeHTML(state.slug || 'project-slug')}\u003c/span>\u003c/div>\u003cspan id=\"af-card-category\">${escapeHTML(state.category)}\u003c/span>\u003c/div>\u003cp id=\"af-card-summary\">${escapeHTML(state.summary || '一句话介绍你的项目，让使用者快速了解它。')}\u003c/p>\u003cdiv class=\"af-preview-version\">\u003cspan class=\"mono\">${state.isNew ? '待发布' : `v${projects.find(project => project.id === state.sourceId).version}`}\u003c/span>\u003cspan class=\"tag tag-green\">${state.isNew ? '新项目' : '稳定版'}\u003c/span>\u003c/div>\u003cdiv class=\"af-preview-card-footer\">\u003cspan id=\"af-card-platforms\">${state.platforms.map(platform => `\u003cspan aria-label=\"${platform}\" title=\"${platform}\">${icon(systemIcon(platform), 14)}\u003c/span>`).join('')}\u003c/span>\u003cspan>查看版本 ${icon('arrow', 13)}\u003c/span>\u003c/div>\u003c/div>`;\n}\n\nfunction renderProjectEdit(state) {\n  return `\u003csection class=\"af-page\">\n    ${pageHeading(state.isNew ? '新建项目' : '项目配置', '让好的软件，从清晰的介绍开始。', `\u003ca class=\"btn btn-light\" href=\"${url('projects')}\">${icon('back', 14)}返回项目列表\u003c/a>${state.isNew ? '' : `\u003ca class=\"btn btn-light\" href=\"${url('project', `id=${state.sourceId}`)}\">${icon('external', 13)}查看前台\u003c/a>`}`, 'PROJECT SETTINGS')}\n    \u003cform class=\"af-layout\" id=\"af-project-form\" novalidate>\n      \u003cdiv class=\"af-main-column\">\n        \u003csection class=\"af-card\">\n          ${cardHeading('项目资料', '这些信息会显示在公开的项目页面。', '\u003cspan class=\"af-section-number mono\">01\u003c/span>')}\n          \u003cdiv class=\"af-fields af-two-fields\">\n            \u003clabel class=\"af-field\" for=\"af-project-name\">\u003cspan>项目名称 \u003ci>*\u003c/i>\u003c/span>\u003cinput id=\"af-project-name\" name=\"name\" value=\"${escapeHTML(state.name)}\" maxlength=\"60\" placeholder=\"例如 Orbit\" aria-describedby=\"af-error-name\" required>${errorSlot('name')}\u003c/label>\n            \u003clabel class=\"af-field\" for=\"af-project-slug\">\u003cspan>项目标识 \u003ci>*\u003c/i>\u003c/span>\u003cdiv class=\"af-input-prefix af-slug-input\">\u003cspan class=\"mono\">/\u003c/span>\u003cinput class=\"mono\" id=\"af-project-slug\" name=\"slug\" value=\"${escapeHTML(state.slug)}\" maxlength=\"80\" placeholder=\"orbit\" aria-describedby=\"af-error-slug\" required>\u003c/div>\u003csmall>用于项目地址，小写字母、数字或短横线\u003c/small>${errorSlot('slug')}\u003c/label>\n            \u003clabel class=\"af-field af-span-all\" for=\"af-project-summary\">\u003cspan>一句话简介 \u003ci>*\u003c/i>\u003cem id=\"af-summary-count\">${state.summary.length}/120\u003c/em>\u003c/span>\u003cinput id=\"af-project-summary\" name=\"summary\" value=\"${escapeHTML(state.summary)}\" maxlength=\"120\" placeholder=\"简单介绍项目能为使用者做什么\" aria-describedby=\"af-error-summary\" required>${errorSlot('summary')}\u003c/label>\n            \u003clabel class=\"af-field af-span-all\" for=\"af-project-description\">\u003cspan>详细介绍 \u003cspan class=\"af-optional\">选填\u003c/span>\u003c/span>\u003ctextarea class=\"af-description\" id=\"af-project-description\" name=\"description\" maxlength=\"5000\" placeholder=\"介绍项目的主要功能、特点和适用场景\">${escapeHTML(state.description)}\u003c/textarea>\u003csmall>帮助新使用者更全面地了解项目。\u003c/small>\u003c/label>\n            \u003clabel class=\"af-field\" for=\"af-project-category\">\u003cspan>项目分类\u003c/span>\u003cselect id=\"af-project-category\" name=\"category\">${['效率工具', '开发工具', '系统工具'].map(category => option(category, state.category)).join('')}\u003c/select>\u003c/label>\n            \u003clabel class=\"af-field\" for=\"af-project-website\">\u003cspan>官方网站 \u003cspan class=\"af-optional\">选填\u003c/span>\u003c/span>\u003cdiv class=\"af-input-prefix af-website-input\">\u003cspan>${icon('link', 14)}\u003c/span>\u003cinput id=\"af-project-website\" name=\"website\" type=\"url\" value=\"${escapeHTML(state.website)}\" maxlength=\"500\" placeholder=\"https://\" aria-describedby=\"af-error-website\">\u003c/div>${errorSlot('website')}\u003c/label>\n            \u003cfieldset class=\"af-field af-span-all af-fieldset\">\u003clegend>支持平台 \u003ci>*\u003c/i>\u003c/legend>\u003cdiv class=\"af-platform-choices\">${SYSTEMS.map(system => `\u003clabel>\u003cinput type=\"checkbox\" name=\"platforms\" value=\"${system}\"${state.platforms.includes(system) ? ' checked' : ''}>${icon(systemIcon(system), 16)}\u003cspan>${system}\u003c/span>\u003c/label>`).join('')}\u003c/div>${errorSlot('platforms')}\u003c/fieldset>\n          \u003c/div>\n        \u003c/section>\n        \u003csection class=\"af-card af-icon-card\">\n          ${cardHeading('项目图标', '一个容易辨认的图标，让项目更有记忆点。', '\u003cspan class=\"af-section-number mono\">02\u003c/span>')}\n          \u003cdiv class=\"af-icon-uploader\">\u003cdiv class=\"af-icon-well\" data-af-project-mark>${projectMark(state.sourceId, 'large')}\u003c/div>\u003cdiv>\u003cbutton type=\"button\" class=\"btn btn-light btn-sm\" id=\"af-select-icon\">${icon('upload', 13)}选择图片\u003c/button>\u003cp>PNG、JPG 或 WebP，建议 256 × 256 px\u003cbr>不超过 2 MB · 仅在本页预览\u003c/p>\u003cinput id=\"af-project-icon\" type=\"file\" accept=\"image/png,image/jpeg,image/webp\" hidden>\u003c/div>\u003c/div>\n        \u003c/section>\n      \u003c/div>\n      \u003caside class=\"af-side-column\">\n        \u003csection class=\"af-card af-visibility-card\">\n          ${cardHeading('项目可见性', '决定谁可以发现这个项目。')}\n          \u003cdiv class=\"af-visibility-options\">\u003clabel class=\"af-visibility-option\">\u003cinput type=\"radio\" name=\"visibility\" value=\"public\"${state.visibility === 'public' ? ' checked' : ''}>\u003cspan class=\"af-visibility-icon\">${icon('globe', 18)}\u003c/span>\u003cspan>\u003cstrong>公开项目\u003c/strong>\u003csmall>所有访客都可以浏览和下载\u003c/small>\u003c/span>\u003c/label>\u003clabel class=\"af-visibility-option\">\u003cinput type=\"radio\" name=\"visibility\" value=\"hidden\"${state.visibility === 'hidden' ? ' checked' : ''}>\u003cspan class=\"af-visibility-icon\">${icon('lock', 18)}\u003c/span>\u003cspan>\u003cstrong>隐藏项目\u003c/strong>\u003csmall>暂不在前台展示\u003c/small>\u003c/span>\u003c/label>\u003c/div>\n        \u003c/section>\n        \u003csection class=\"af-card af-project-preview-panel\">\n          \u003cdiv class=\"af-summary-label\">前台卡片预览 \u003cspan class=\"af-live-label\">\u003cspan>\u003c/span>实时\u003c/span>\u003c/div>\n          ${projectPreview(state)}\u003cp class=\"af-preview-note\" id=\"af-visibility-note\">${state.visibility === 'hidden' ? '当前为隐藏状态，保存后前台不展示。' : '项目将在首页的项目列表中展示。'}\u003c/p>\n          \u003cbutton type=\"submit\" class=\"btn btn-primary btn-wide\">${icon('check', 15)}保存项目配置\u003c/button>\u003cp class=\"af-save-status\" id=\"af-project-save-status\">设计预览 · 仅保存本地草稿\u003c/p>\n        \u003c/section>\n        \u003cp class=\"af-side-note\">${icon('info', 13)}项目资料可以随时调整，已发布版本将独立保留。\u003c/p>\n      \u003c/aside>\n    \u003c/form>\n  \u003c/section>`;\n}\n\n// Markdown 先转义后排版，只允许安全的公开网页链接。\nfunction inlineMarkdown(value) {\n  return escapeHTML(value).replace(/`([^`]+)`/g, '\u003ccode>$1\u003c/code>').replace(/\\*\\*([^*]+)\\*\\*/g, '\u003cstrong>$1\u003c/strong>').replace(/\\[([^\\]]+)\\]\\((https?:\\/\\/[^\\s)]+)\\)/g, '\u003ca href=\"$2\" target=\"_blank\" rel=\"noopener noreferrer\">$1\u003c/a>');\n}\n\nfunction markdown(value) {\n  let inList = false;\n  let output = '';\n  for (const line of value.replace(/\\r/g, '').split('\\n')) {\n    const bullet = /^\\s*[-*]\\s+(.+)/.exec(line);\n    if (bullet) {\n      if (!inList) output += '\u003cul>';\n      output += `\u003cli>${inlineMarkdown(bullet[1])}\u003c/li>`;\n      inList = true;\n      continue;\n    }\n    if (inList) { output += '\u003c/ul>'; inList = false; }\n    const heading = /^(#{1,3})\\s+(.+)/.exec(line);\n    if (heading) output += `\u003ch${heading[1].length + 2}>${inlineMarkdown(heading[2])}\u003c/h${heading[1].length + 2}>`;\n    else if (line.trim()) output += `\u003cp>${inlineMarkdown(line)}\u003c/p>`;\n  }\n  return (output + (inList ? '\u003c/ul>' : '')) || '\u003cp class=\"muted\">写下更新内容，即可在这里看到预览。\u003c/p>';\n}\n\nfunction clearErrors(form) {\n  form.querySelectorAll('.af-error').forEach(node => { node.textContent = ''; });\n  form.querySelectorAll('[aria-invalid]').forEach(node => node.removeAttribute('aria-invalid'));\n}\n\nfunction fieldError(form, name, message) {\n  const slot = form.querySelector(`#af-error-${name}`);\n  if (slot) slot.textContent = message;\n  const field = form.elements.namedItem(name);\n  if (field instanceof Element) field.setAttribute('aria-invalid', 'true');\n}\n\nfunction validVersion(value) {\n  const match = /^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-([0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*))?(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$/.exec(value);\n  return !!match && (!match[4] || match[4].split('.').every(part => !/^\\d+$/.test(part) || part === '0' || part[0] !== '0'));\n}\n\nfunction collectRelease(form, state) {\n  const fields = new FormData(form);\n  Object.assign(state, { project: fields.get('project'), version: fields.get('version').trim(), title: fields.get('title').trim(), channel: fields.get('channel'), notes: fields.get('notes'), latest: fields.get('channel') === 'stable' && fields.has('latest') });\n}\n\nfunction validateRelease(form, state, needsFiles = false) {\n  clearErrors(form);\n  const errors = [];\n  if (!validVersion(state.version)) errors.push(['version', '请输入有效版本号，例如 2.9.0 或 2.9.0-beta.1。']);\n  else if (state.channel === 'stable' && state.version.split('+')[0].includes('-')) errors.push(['version', '带 beta 等预发布标识的版本，请选择「预发布」渠道。']);\n  if (!state.title) errors.push(['title', '请填写这次版本的发布标题。']);\n  if (!state.notes.trim()) errors.push(['notes', '请填写更新日志，帮助使用者了解本次变化。']);\n  if (needsFiles && !state.files.length) errors.push(['files', '请至少添加一个安装包。']);\n  errors.forEach(([name, message]) => fieldError(form, name, message));\n  if (errors.length) {\n    const first = form.querySelector('[aria-invalid=\"true\"]') || form.querySelector('#af-select-files');\n    if (first?.id === 'af-release-notes') form.querySelector('#af-edit-tab')?.click();\n    first?.focus();\n    toast('还有内容需要完善，请检查表单中的提示。');\n  }\n  return !errors.length;\n}\n\nfunction bindPublish() {\n  const form = document.querySelector('#af-publish-form');\n  const state = releaseState;\n  const list = form.querySelector('#af-file-list');\n  const notes = form.querySelector('#af-release-notes');\n  const dialog = document.querySelector('#af-preview-dialog');\n  const updateSummary = () => {\n    collectRelease(form, state);\n    const project = projects.find(item => item.id === state.project);\n    form.querySelector('#af-summary-name').textContent = project.name;\n    form.querySelector('#af-summary-mark').innerHTML = projectMark(project.id);\n    form.querySelector('#af-summary-version').textContent = state.version ? `v${state.version}` : '待填写版本号';\n    form.querySelector('#af-summary-title').textContent = state.title || '为这次更新写一个标题';\n    const channel = form.querySelector('#af-summary-channel');\n    channel.textContent = state.channel === 'stable' ? '稳定版' : '预发布';\n    channel.className = `tag ${state.channel === 'stable' ? 'tag-green' : 'tag-orange'}`;\n    const latest = form.querySelector('#af-latest');\n    latest.disabled = state.channel === 'preview';\n    if (latest.disabled) latest.checked = false;\n    form.querySelector('#af-latest-hint').textContent = latest.disabled ? '预发布版本不会替换最新稳定版' : '在项目前台优先展示此版本';\n    form.querySelector('#af-notes-count').textContent = `${notes.value.length} 字`;\n    form.querySelector('#af-notes-preview-panel').innerHTML = markdown(notes.value);\n  };\n  const updateFiles = () => {\n    list.innerHTML = fileRows(state.files);\n    form.querySelector('#af-file-count').textContent = `${state.files.length} 个文件`;\n    form.querySelector('#af-summary-files').textContent = `${state.files.length} 个安装包`;\n    form.querySelector('#af-error-files').textContent = '';\n  };\n  form.addEventListener('input', updateSummary);\n  form.addEventListener('change', updateSummary);\n  list.addEventListener('click', event => {\n    const button = event.target.closest('[data-af-remove-file]');\n    if (!button) return;\n    state.files.splice(Number(button.dataset.afRemoveFile), 1);\n    updateFiles();\n  });\n  list.addEventListener('change', event => {\n    const select = event.target;\n    if (select.dataset.afFileSystem !== undefined) state.files[Number(select.dataset.afFileSystem)].system = select.value;\n    if (select.dataset.afFileArch !== undefined) state.files[Number(select.dataset.afFileArch)].arch = select.value;\n    updateFiles();\n  });\n  const addFiles = files => {\n    let added = 0;\n    const rejected = [];\n    for (const file of files) {\n      if (file.size > MAX_FILE_SIZE) { rejected.push(`${file.name} 超过 2 GB`); continue; }\n      if (state.files.length >= 50) { rejected.push('最多可预览 50 个文件'); break; }\n      if (state.files.some(item => item.name === file.name && item.size === file.size)) continue;\n      const system = /mac|darwin|\\.(dmg|pkg)$/i.test(file.name) ? 'macOS' : /linux|\\.(appimage|deb|rpm)$/i.test(file.name) ? 'Linux' : 'Windows';\n      const arm = /arm|aarch64/i.test(file.name);\n      state.files.push({ name: file.name, size: file.size, system, arch: arm ? system === 'macOS' ? 'Apple Silicon' : 'ARM64' : 'x64', sample: false });\n      added++;\n    }\n    updateFiles();\n    if (rejected.length) { form.querySelector('#af-error-files').textContent = rejected.join('；'); toast('部分文件未添加，请查看安装包区域的提示。'); }\n    else toast(added ? `已添加 ${added} 个本地文件，尚未上传。` : '所选文件已经在列表中。');\n  };\n  const packageInput = form.querySelector('#af-package-input');\n  form.querySelector('#af-select-files').addEventListener('click', () => packageInput.click());\n  packageInput.addEventListener('change', () => { addFiles(packageInput.files); packageInput.value = ''; });\n  const dropzone = form.querySelector('#af-dropzone');\n  let dragDepth = 0;\n  dropzone.addEventListener('dragenter', event => { event.preventDefault(); dragDepth++; dropzone.classList.add('af-drag-active'); });\n  dropzone.addEventListener('dragover', event => { event.preventDefault(); event.dataTransfer.dropEffect = 'copy'; });\n  dropzone.addEventListener('dragleave', event => { event.preventDefault(); if (--dragDepth \u003c= 0) dropzone.classList.remove('af-drag-active'); });\n  dropzone.addEventListener('drop', event => { event.preventDefault(); dragDepth = 0; dropzone.classList.remove('af-drag-active'); addFiles(event.dataTransfer.files); });\n  const tabs = [...form.querySelectorAll('[data-af-editor-tab]')];\n  const showEditor = tab => {\n    const preview = tab.dataset.afEditorTab === 'preview';\n    tabs.forEach(button => { button.classList.toggle('active', button === tab); button.setAttribute('aria-selected', String(button === tab)); button.tabIndex = button === tab ? 0 : -1; });\n    form.querySelector('#af-notes-edit-panel').hidden = preview;\n    form.querySelector('#af-notes-preview-panel').hidden = !preview;\n    form.querySelector('#af-format-actions').hidden = preview;\n    form.querySelector('#af-notes-preview-panel').innerHTML = markdown(notes.value);\n  };\n  tabs.forEach((tab, index) => {\n    tab.tabIndex = index === 0 ? 0 : -1;\n    tab.addEventListener('click', () => showEditor(tab));\n    tab.addEventListener('keydown', event => { if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') { event.preventDefault(); const next = tabs[(index + 1) % tabs.length]; showEditor(next); next.focus(); } });\n  });\n  form.querySelectorAll('[data-af-format]').forEach(button => button.addEventListener('click', () => {\n    const formats = { heading: ['## ', '', '标题'], bold: ['**', '**', '重要内容'], list: ['- ', '', '列表内容'], code: ['`', '`', '代码'], link: ['[', '](https://example.com)', '链接文字'] };\n    const [before, after, placeholder] = formats[button.dataset.afFormat];\n    const start = notes.selectionStart;\n    const selected = notes.value.slice(start, notes.selectionEnd) || placeholder;\n    notes.setRangeText(before + selected + after, start, notes.selectionEnd, 'end');\n    notes.focus();\n    notes.setSelectionRange(start + before.length, start + before.length + selected.length);\n    notes.dispatchEvent(new Event('input', { bubbles: true }));\n  }));\n  document.querySelector('#af-save-draft').addEventListener('click', () => {\n    collectRelease(form, state);\n    if (persistDraft('publish', state)) {\n      document.querySelector('#af-save-status').textContent = `草稿已保存至本浏览器 · ${new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute
